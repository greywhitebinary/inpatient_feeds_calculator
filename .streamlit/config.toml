# Shared enteral-tool palette. Streamlit reads this file when the app starts.
[theme]
primaryColor = "#A4243A"
linkColor = "#A4243A"
# #FAFAFA is the one page ground shared with BTF-Calc and feedformflow.ca
# (2026-09-28; it was #FCFAF9). See the Feed. Form. Flow. visual identity guide.
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F9E8EB"
textColor = "#292526"
font = "sans serif"

[theme.dark]
primaryColor = "#E0708A"
linkColor = "#E0708A"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#3A2429"
textColor = "#F5F5F5"
