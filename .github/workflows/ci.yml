name: CI

# WHAT THIS GUARDS
#
# Adapted from BTF-Calc's ci.yml, which exists because a broken check sat on
# `main` for a week and nobody noticed -- nothing ran it. The principle is
# worth repeating here: a check that only runs when someone remembers is not
# a check, it is a habit.
#
# This repo has a public deployment and a stylesheet that reaches into
# Streamlit's internal DOM, and until now had nothing running its tests at
# all. Every check the project has runs here, on every push.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC. Nothing in the repo changes on a Monday --
    # this catches the world changing underneath it. webapp/requirements.txt
    # pins streamlit exactly but lets pandas float, and a floating dependency
    # is how BTF-Calc's Streamlit 1.60 deploy broke.
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Tests, checks and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          # Matches Streamlit Community Cloud and the local webapp/.venv.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # The tests each insert webapp/ on sys.path themselves, so they run
      # from the repo root with no conftest and no pytest configuration.
      - name: Run pytest
        run: pytest webapp/tests/ -v

      # Unit tests drive Streamlit's Python API and never see a stylesheet,
      # so a renamed data-testid breaks the page with every test still green.
      # This is the only check that looks at the CSS hooks.
      - name: CSS hooks still exist in Streamlit
        run: python scripts/check_css_hooks.py

      # --- Lint ---------------------------------------------------------
      - name: Run ruff check
        run: ruff check .

      - name: Run black --check
        run: black --check .

  # No deploy job here on purpose: the hosting platform deploys from `main`.
