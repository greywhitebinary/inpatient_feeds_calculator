name: ENCalc deployment canary

# Streamlit Community Cloud can hibernate an app after a period without
# traffic. This workflow visits the deployed app every eight hours, clicks
# Streamlit's wake-up button when necessary, and fails unless the real app
# interface loads. The 5:45am Eastern visit makes the app ready before the
# 6:30am hospital workday, while the eight-hour cadence prevents hibernation.
#
# This checks the deployed site only. It does not check application
# correctness; ci.yml and canary.yml cover the source code.
#
# There is deliberately no checkout. This workflow never needs repository
# files, so it cannot modify application code even by accident.

"on":
  workflow_dispatch:
  schedule:
    - cron: "45 5,13,21 * * *"
      timezone: "America/Toronto"

concurrency:
  # Two overlapping runs could both click "wake up" at once. Queue instead.
  group: encalc-deployment-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Open the deployed app and confirm it loads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Write canary script
        run: |
          cat <<'EOF' > canary-check.js
          const { chromium } = require("playwright");

          const APP_URL = "https://encalc.streamlit.app";
          const NAV_TIMEOUT_MS = 60_000;
          const APP_READY_TIMEOUT_MS = 5 * 60_000; // cold starts are slow
          const POLL_INTERVAL_MS = 2_000;

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            try {
              console.log(`Opening ${APP_URL} ...`);
              await page.goto(APP_URL, {
                timeout: NAV_TIMEOUT_MS,
                waitUntil: "domcontentloaded",
              });

              const appFrame = page.frameLocator("iframe");
              const wakeButtons = [
                page.getByRole("button", { name: /Yes, get this app back up!/i }),
                appFrame.getByRole("button", { name: /Yes, get this app back up!/i }),
              ];
              const formularyTabs = [
                page.getByRole("tab", { name: "Formulary" }),
                appFrame.getByRole("tab", { name: "Formulary" }),
              ];
              const firstVisible = async (locators) => {
                for (const locator of locators) {
                  if (await locator.isVisible()) {
                    return locator;
                  }
                }
                return null;
              };
              const deadline = Date.now() + APP_READY_TIMEOUT_MS;
              let wakeRequested = false;

              console.log("Waiting for Streamlit to show the wake-up button or the app...");

              while (Date.now() < deadline) {
                if (await firstVisible(formularyTabs)) {
                  console.log(
                    wakeRequested
                      ? "App loaded successfully after wake-up."
                      : "App already awake; no wake-up action was needed."
                  );
                  return;
                }

                const wakeButton = await firstVisible(wakeButtons);
                if (!wakeRequested && wakeButton) {
                  console.log("App is asleep. Clicking the wake-up button.");
                  await wakeButton.click();
                  wakeRequested = true;
                }

                await page.waitForTimeout(POLL_INTERVAL_MS);
              }

              throw new Error(
                wakeRequested
                  ? "The wake-up button was clicked, but the app did not finish loading."
                  : "Neither the wake-up button nor the loaded app appeared."
              );
            } catch (err) {
              console.error("Canary check failed:", err);
              try {
                await page.screenshot({ path: "canary-failure.png", fullPage: true });
              } catch (screenshotErr) {
                console.error("Could not capture a failure screenshot:", screenshotErr);
              }
              process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run canary check
        run: node canary-check.js

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canary-failure-screenshot
          path: canary-failure.png
          retention-days: 14
