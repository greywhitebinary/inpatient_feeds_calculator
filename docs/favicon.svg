<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Feed. Form. Flow." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Blue in front, mustard in the middle, claret at the back. Mustard is the
       only light colour, so it keeps the two darks apart: claret touching blue
       would be 1.07:1. See the Feed. Form. Flow. visual identity guide. -->
  <style>
    .fff-panel { fill: #245B78; }
    .fff-gold { fill: #D9A62E; }
    .fff-claret { fill: #A4243A; }
    .fff-mark { fill: #FAFAFA; }
    .fff-wave { stroke: #FAFAFA; }
    /* Dark tab bars: change only what fails there. The panel lifts to a mid
       blue (3.25:1 on #202124, white marks 4.96:1 on it) and claret lifts to
       #E0708A (5.25:1). Mustard already reads at 7.2:1 and stays. */
    @media (prefers-color-scheme: dark) {
      .fff-panel { fill: #407694; }
      .fff-claret { fill: #E0708A; }
      .fff-mark { fill: #FFFFFF; }
      .fff-wave { stroke: #FFFFFF; }
    }
  </style>
  <g transform="rotate(1.2 32 32)">
    <rect class="fff-claret" x="10" y="10" width="51" height="51" rx="8"/>
  </g>
  <g transform="rotate(0.4 32 32)">
    <rect class="fff-gold" x="6.5" y="6.5" width="51" height="51" rx="8"/>
  </g>
  <g transform="rotate(-1.5 28.5 28.5)">
    <rect class="fff-panel" x="3" y="3" width="51" height="51" rx="8.2"/>
    <g transform="translate(-0.64 -0.64) scale(0.9107)">
      <path class="fff-wave" d="M16 30c5-9 11-9 16 0s11 9 16 0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <circle class="fff-mark" cx="20" cy="44" r="4.5"/>
      <circle class="fff-mark" cx="32" cy="44" r="4.5"/>
      <circle class="fff-gold" cx="44" cy="44" r="4.5"/>
    </g>
  </g>
</svg>
